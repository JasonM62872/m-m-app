name: Compile Mobile Package
on: [push]

# 🌟 FIXED: Swapped out the old unsecure node flag for the new native Node 24 activation key!
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # Python environment action configuration profile
      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Java setup action script interface configuration
      - name: Setup Java framework
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Deploys Google Android SDK build architecture blocks
      - name: Deploy Google Android SDK
        uses: android-actions/setup-android@v4

      - name: Install System Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 libasound2-dev xvfb

      - name: Install build systems
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli
          pip install -r requirements.txt

      - name: Execute Android APK compilation task
        run: |
          xvfb-run --server-args="-screen 0 1024x768x24" flet build apk
