name: Compile Mobile Package
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java framework
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Deploy Google Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build systems
        run: |
          python -m pip install --upgrade pip
          pip install flet-cli
          pip install -r requirements.txt

      - name: Execute Android APK compilation task
        run: |
          flet build apk

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-control-dashboard-apk
          path: build/apk/*.apk
