name: Compile Mobile Package
on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java framework
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Deploy Google Android SDK
        uses: android-actions/setup-android@v4

      - name: Install System Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 libasound2-dev xvfb

      - name: Install build systems
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli
          pip install -r requirements.txt

      - name: Execute Android APK compilation task
        run: |
          yes | xvfb-run --server-args="-screen 0 1024x768x24" flet build apk --python-version 3.12

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-control-dashboard-apk
          path: build/apk/*.apk
