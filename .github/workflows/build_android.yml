name: Compile Mobile Package
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java framework
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Deploy Google Android SDK
        uses: android-actions/setup-android@v3

      - name: Install System Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 libasound2-dev xvfb

      - name: Install build systems
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli
          pip install -r requirements.txt

      # 🌟 FIXED: Runs the compilation tool inside an isolated visual virtual buffer (xvfb)
      # This tricks modules like Pygame into thinking they are attached to a real mobile phone canvas!
      - name: Execute Android APK compilation task
        run: |
          xvfb-run --server-args="-screen 0 1024x768x24" flet build apk
