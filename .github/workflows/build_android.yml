name: Compile Mobile Package
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # 🌟 UPDATED: Upgraded Python environment action to v5 to match Node 24 runtime rules
      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🌟 UPDATED: Upgraded Java setup action to v5 to bypass EOL deprecation locks
      - name: Setup Java framework
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🌟 UPDATED: Swapped to a rock-solid, production-grade Android SDK command suite
      - name: Deploy Google Android SDK
        uses: android-actions/setup-android@v4

      - name: Install System Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 libasound2-dev xvfb

      - name: Install build systems
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli
          pip install -r requirements.txt

      - name: Execute Android APK compilation task
        run: |
          xvfb-run --server-args="-screen 0 1024x768x24" flet build apk
