name: Compile Mobile Package
on:
  push:
  workflow_dispatch:  # 🌟 NEW: This permanently activates the manual "Run workflow" button on GitHub!

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java framework
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Deploy Google Android SDK
        uses: android-actions/setup-android@v4

      - name: Install System Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 libasound2-dev xvfb

      - name: Install build systems
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli
          pip install -r requirements.txt

      # 🌟 FIXED: Commands the compiler to look directly at your "src" folder for the main script app!
      - name: Execute Android APK compilation task
        run: |
          yes | xvfb-run --server-args="-screen 0 1024x768x24" flet build apk --module-name main_app src/
